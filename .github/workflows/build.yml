name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  php-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: php -l server/public/index.php
      - name: Start API and check health
        shell: bash
        run: |
          php -S 127.0.0.1:8080 -t server/public server/public/index.php >/tmp/filebuddy-php.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:8080/health && exit 0; sleep 1; done
          cat /tmp/filebuddy-php.log
          exit 1

  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:win
            arch: x64
          - os: macos-latest
            script: build:mac:x64
            arch: x64
          - os: macos-latest
            script: build:mac:arm64
            arch: arm64
          - os: ubuntu-latest
            script: build:linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: filebuddy-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: filebuddy-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
