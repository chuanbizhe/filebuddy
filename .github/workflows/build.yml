name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  php-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: php -l server/public/index.php
      - run: php -l server/src/TencentSmsService.php
      - run: php -l server/src/AlipayGateway.php
      - name: Smoke-test API auth and connection credentials
        shell: bash
        run: |
          php -S 127.0.0.1:8080 -t server/public server/public/index.php >/tmp/filebuddy-php.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:8080/health >/tmp/filebuddy-health.json && break; sleep 1; done
          test -s /tmp/filebuddy-health.json
          cat /tmp/filebuddy-health.json
          curl --fail --silent http://127.0.0.1:8080/v1/billing/plans | jq -e '.plans | length == 2' >/dev/null
          email="ci-${GITHUB_RUN_ID}@example.test"
          register=$(curl --fail --silent -X POST http://127.0.0.1:8080/v1/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"$email\",\"password\":\"TestPassword123\"}")
          token=$(echo "$register" | jq -r .token)
          test -n "$token" && test "$token" != "null"
          workspace=$(curl --fail --silent -X POST http://127.0.0.1:8080/v1/workspaces -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI Workspace","permission":"read_write"}')
          workspace_id=$(echo "$workspace" | jq -r .id)
          connection=$(curl --fail --silent -X POST "http://127.0.0.1:8080/v1/workspaces/$workspace_id/connections" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{}')
          api_key=$(echo "$connection" | jq -r .apiKey)
          test "$(echo "$connection" | jq -r .mcpUrl)" = "http://127.0.0.1:8080/mcp/$workspace_id"
          curl --fail --silent "http://127.0.0.1:8080/v1/bridge/$workspace_id" -H "X-FileBuddy-Key: $api_key" | jq -e '.workspace == "/workspace"' >/dev/null

  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:win
            arch: x64
          - os: macos-latest
            script: build:mac:x64
            arch: x64
          - os: macos-latest
            script: build:mac:arm64
            arch: arm64
          - os: ubuntu-latest
            script: build:linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: filebuddy-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: filebuddy-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
